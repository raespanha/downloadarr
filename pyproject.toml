[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "downloadarr"
version = "0.1.0"
description = "Reliable resumable multi-connection HTTP downloader"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiofiles>=24.1,<26",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiohttp>=3.10", "httpx>=0.28,<1"]

[project.scripts]
downloadarr = "downloadarr.cli:main"
downloadarr-api = "downloadarr.api.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/downloadarr"]
