[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "downloadarr"
version = "0.1.0"
description = "Reliable resumable multi-connection HTTP downloader"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "raespanha" }]
requires-python = ">=3.12,<3.14"
keywords = ["sonarr", "radarr", "torbox", "downloader", "qbittorrent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "aiohttp>=3.10,<4",
  "aiofiles>=24.1,<26",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/raespanha/downloadarr"
Documentation = "https://github.com/raespanha/downloadarr/tree/main/docs"
Issues = "https://github.com/raespanha/downloadarr/issues"
Source = "https://github.com/raespanha/downloadarr"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiohttp>=3.10", "httpx>=0.28,<1"]

[project.scripts]
downloadarr = "downloadarr.cli:main"
downloadarr-api = "downloadarr.api.app:main"
downloadarr-verify-arr-cleanup = "downloadarr.arr_cleanup_test:main"
downloadarr-maintenance = "downloadarr.maintenance:main"
downloadarr-benchmark = "downloadarr.benchmark:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/downloadarr"]
