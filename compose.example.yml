services:
  downloadarr:
    build:
      context: .
    image: downloadarr:local
    container_name: downloadarr
    env_file:
      - .env
    ports:
      - "${DOWNLOADARR_BIND:-127.0.0.1}:6500:6500"
    volumes:
      - ./config:/config
      - ${DOWNLOADARR_MEDIA_PATH:-./data}:/downloads
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 120s
    restart: unless-stopped
