name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pip check
      - run: python -m compileall -q src
      - run: PYTHONPATH=src python -m pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: DOWNLOADARR_ENV_FILE=.env.example DOWNLOADARR_MEDIA_PATH=/tmp/downloadarr docker compose config --quiet
      - run: docker build --pull=false -t downloadarr:ci .
      - run: docker run --rm --entrypoint python downloadarr:ci -c "import os; assert os.getuid() != 0; import downloadarr"
