services:
  downloadarr:
    build:
      context: .
      args:
        UID: ${DOWNLOADARR_UID:-1000}
        GID: ${DOWNLOADARR_GID:-1000}
    image: downloadarr:local
    container_name: downloadarr
    user: "${DOWNLOADARR_UID:-1000}:${DOWNLOADARR_GID:-1000}"
    env_file:
      - ${DOWNLOADARR_ENV_FILE:-.env}
    environment:
      DOWNLOADARR_CONFIG: /config/settings.json
    ports:
      - "${DOWNLOADARR_BIND:-127.0.0.1}:6500:6500"
    volumes:
      - ${DOWNLOADARR_CONFIG_PATH:-./config}:/config:rw
      - ${DOWNLOADARR_MEDIA_PATH:?Set DOWNLOADARR_MEDIA_PATH in .env}:/downloads:rw
    networks:
      - downloadarr
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${DOWNLOADARR_MEMORY_LIMIT:-1g}
    cpus: ${DOWNLOADARR_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6500/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 120s
    restart: unless-stopped

networks:
  downloadarr:
    external: true
    name: ${DOWNLOADARR_NETWORK:-downloadarr}
